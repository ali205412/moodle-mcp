name: Moodle Plugin Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none

      - name: Resolve release metadata
        id: meta
        run: |
          VERSION="$(sed -n "s/^\$plugin->release = '\(.*\)';/\1/p" version.php | head -n1)"
          if [ -z "${VERSION}" ]; then
            VERSION="$(sed -n "s/^\$plugin->version = \([0-9][0-9]*\);/\1/p" version.php | head -n1)"
          fi
          if [ -z "${VERSION}" ]; then
            echo "Could not determine plugin version from version.php" >&2
            exit 1
          fi
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"

          if git ls-remote --tags origin | grep -q "refs/tags/${TAG}$"; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Create and push tag
        if: steps.meta.outputs.exists == 'false'
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${TAG}"
          git push origin "${TAG}"

      - name: Build Moodle plugin package
        if: steps.meta.outputs.exists == 'false'
        id: package
        run: |
          PACKAGE_PATH="$(bash scripts/package-release.sh)"
          echo "package=${PACKAGE_PATH}" >> "${GITHUB_OUTPUT}"

      - name: Upload packaged artifact
        if: steps.meta.outputs.exists == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: webservice_mcp-${{ steps.meta.outputs.version }}
          path: ${{ steps.package.outputs.package }}

      - name: Publish GitHub release
        if: steps.meta.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          files: ${{ steps.package.outputs.package }}
          body: |
            Moodle MCP plugin release `${{ steps.meta.outputs.version }}`.

            Packaged asset:
            - `webservice_mcp-${{ steps.meta.outputs.version }}.zip`

            This ZIP is built from the plugin root and packaged with the Moodle plugin directory name `mcp/`.
          draft: false
          prerelease: false
